name: Validate plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r bin/requirements.txt 'pytest>=8,<9' 'ruff==0.15.0'
      - run: sudo apt-get update && sudo apt-get install -y libconfig-simple-perl
      - run: pip check && ruff check . && pytest -q
      - run: find bin webfrontend -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: for script in preroot.sh preupgrade.sh postinstall.sh postupgrade.sh postroot.sh uninstall/uninstall.sh; do bash -n "$script" || exit; done
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: samsung-local-${{ matrix.python }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    concurrency: loxberry-release-feed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag and select channel
        id: channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import configparser, os
          cfg = configparser.ConfigParser()
          cfg.read('plugin.cfg')
          version = cfg['PLUGIN']['VERSION']
          tag = os.environ['RELEASE_TAG']
          assert tag in ('v' + version, 'v' + version + '-edge')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nedge={str(tag.endswith("-edge")).lower()}\n')
          PY
      - run: python tools/build.py
      - name: Create permanent download asset
        env:
          VERSION: ${{ steps.channel.outputs.version }}
          EDGE: ${{ steps.channel.outputs.edge }}
        run: |
          alias=loxberry-samsung-local.zip
          if [ "$EDGE" = true ]; then alias=loxberry-samsung-local-edge.zip; fi
          cp "dist/loxberry-samsung-local-$VERSION.zip" "dist/$alias"
          (cd dist && sha256sum "$alias" > "$alias.sha256")
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EDGE: ${{ steps.channel.outputs.edge }}
        run: |
          flags=(--latest)
          if [ "$EDGE" = true ]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 "${flags[@]}" --title "Samsung Local $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
      - name: Refresh permanent edge download
        if: steps.channel.outputs.edge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf 'Development channel. Current build: %s.\n\nSee the versioned release for release notes. This download changes with each tested prerelease.\n' "$RELEASE_TAG" > "$RUNNER_TEMP/edge-notes.txt"
          if gh release view edge >/dev/null 2>&1; then
            gh release upload edge dist/loxberry-samsung-local-edge.zip dist/loxberry-samsung-local-edge.zip.sha256 --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" -f sha="$GITHUB_SHA" -F force=true
            gh release edit edge --prerelease --latest=false --title "Samsung Local edge (development)" --notes-file "$RUNNER_TEMP/edge-notes.txt"
          else
            gh release create edge dist/loxberry-samsung-local-edge.zip dist/loxberry-samsung-local-edge.zip.sha256 --target "$GITHUB_SHA" --prerelease --latest=false --title "Samsung Local edge (development)" --notes-file "$RUNNER_TEMP/edge-notes.txt"
          fi
      - name: Publish native update feeds after release assets exist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.channel.outputs.version }}
          EDGE: ${{ steps.channel.outputs.edge }}
        run: |
          cp tools/update_feed.py "$RUNNER_TEMP/update_feed.py"
          if git ls-remote --exit-code --heads origin updates; then
            git fetch origin updates
            git switch -C updates FETCH_HEAD
          else
            git switch --orphan updates
          fi
          flags=()
          if [ "$EDGE" != true ]; then flags=(--stable); fi
          python "$RUNNER_TEMP/update_feed.py" "$VERSION" . --tag "$RELEASE_TAG" "${flags[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.cfg prerelease.cfg
          if ! git diff --cached --quiet; then
            git commit -m "Publish LoxBerry update feed for $RELEASE_TAG"
            git push origin HEAD:updates
          fi
