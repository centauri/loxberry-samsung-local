name: Validate plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r bin/requirements.txt 'pytest>=8,<9' 'ruff==0.15.0'
      - run: pip check && ruff check . && pytest -q
      - run: php -l webfrontend/htmlauth/index.php
      - run: for script in preroot.sh preupgrade.sh postinstall.sh postupgrade.sh postroot.sh uninstall/uninstall.sh; do bash -n "$script" || exit; done
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: samsung-local-${{ matrix.python }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import configparser, os
          cfg = configparser.ConfigParser()
          cfg.read('plugin.cfg')
          assert os.environ['RELEASE_TAG'] == 'v' + cfg['PLUGIN']['VERSION']
          PY
      - run: python tools/build.py
      - name: Publish tested evaluation release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --prerelease --title "Samsung Local $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
