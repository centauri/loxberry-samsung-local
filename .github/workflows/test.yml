name: Validate plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r bin/requirements.txt 'pytest>=8,<9' 'ruff==0.15.0'
      - run: sudo apt-get update && sudo apt-get install -y libconfig-simple-perl
      - run: pip check && ruff check . && pytest -q
      - run: find bin webfrontend -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: for script in preroot.sh preupgrade.sh postinstall.sh postupgrade.sh postroot.sh uninstall/uninstall.sh; do bash -n "$script" || exit; done
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: samsung-local-${{ matrix.python }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    concurrency: loxberry-release-feed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import configparser, os
          cfg = configparser.ConfigParser()
          cfg.read('plugin.cfg')
          assert os.environ['RELEASE_TAG'] == 'v' + cfg['PLUGIN']['VERSION']
          PY
      - run: python tools/build.py
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --latest --title "Samsung Local $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
      - name: Publish LoxBerry stable and prerelease feeds after release assets exist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp tools/update_feed.py "$RUNNER_TEMP/update_feed.py"
          if git ls-remote --exit-code --heads origin updates; then
            git fetch origin updates
            git switch -C updates FETCH_HEAD
          else
            git switch --orphan updates
          fi
          python "$RUNNER_TEMP/update_feed.py" "${RELEASE_TAG#v}" . --stable
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.cfg prerelease.cfg
          if ! git diff --cached --quiet; then
            git commit -m "Publish LoxBerry update feed for $RELEASE_TAG"
            git push origin HEAD:updates
          fi
